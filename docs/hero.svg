<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Clawd Cursor — It sees. It acts. It verifies.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e16"/>
      <stop offset="1" stop-color="#16131f"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="820" height="300" rx="18" fill="url(#bg)"/>
  <!-- circular clawd with its own red cursor -->
  <g transform="translate(70,86)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#e2e2ea" stroke-width="3"/>
    <circle cx="-11" cy="-6" r="4.5" fill="#e2e2ea"/>
    <circle cx="11" cy="-6" r="4.5" fill="#e2e2ea"/>
    <path d="M -14 12 Q 0 22 14 12" fill="none" stroke="#e2e2ea" stroke-width="3" stroke-linecap="round"/>
    <!-- red recording cursor -->
    <path d="M 26 26 L 50 36 L 40 40 L 46 52 L 41 54 L 35 42 L 28 48 Z" fill="#ff3b30"/>
  </g>
  <text x="128" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">clawd<tspan fill="#cbd5e1">cursor</tspan></text>
  <text x="129" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#94a3b8">Safe desktop control for any AI agent &#183; local &#183; cross-OS</text>
  <text x="70" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#grad)">It sees. It acts. It verifies.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">
    <text x="70" y="232">&#9679; reads the accessibility tree, not screenshots</text>
    <text x="70" y="258">&#9679; verifies its own actions &#183; one safety gate &#183; no cloud</text>
  </g>
  <g transform="translate(560,210)">
    <rect x="0" y="0" width="190" height="44" rx="22" fill="#22c55e"/>
    <text x="95" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0e0e16">&#9654;  live demo &#8594; clawdcursor.com</text>
  </g>
</svg>
